name: Test stack
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu:
    # run the suite on every supported release and every architecture the images ship for
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # check out the repo so the suite drives this branch's lifecycle and compose files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # require the confinement the suite reads back
      - name: Require AppArmor
        run: aa-enabled

      # install the Go toolchain go.mod names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # run the tests that raise one component of the stack, built from this branch
      - name: Run the integration tests
        run: go test -tags integration -count=1 -v ./test/integration/...

      # install the CLI this host's editor raises the stack with
      - name: Install the dev container CLI
        run: npm install -g @devcontainers/cli

      # hold the test dependencies apart from the interpreter this host manages
      - name: Install the test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest pytest-testinfra

      # run the suite against the stack this host raises
      - name: Run the suite
        run: .venv/bin/pytest test -v
