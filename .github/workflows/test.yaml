name: Test stack
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu:
    # run the suite on every supported release and every architecture the images ship for
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # check out the repo so the suite drives this branch's cage scripts and compose files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # require the confinement the suite reads back
      - name: Require AppArmor
        run: aa-enabled

      # install the latest release with this branch's install.sh into a fresh home, the devcontainer CLI included, the way a bare machine does
      - name: Install o3s on a bare home
        run: |
          home="$(mktemp -d)"
          HOME="${home}" sh install.sh
          "${home}/.local/share/o3s/devcontainers/bin/devcontainer" --version

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # run the tests that raise one component of the stack, built from this branch
      - name: Run the integration tests
        run: go test -tags integration -count=1 -v ./test/integration/...

      # install the CLI this host's editor raises the stack with, at the version the lockfile pins
      - name: Install the dev container CLI
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # run the tests that raise the whole stack on this host, the way the editor raises it
      - name: Run the e2e tests
        env:
          # let bake read the Dockerfile the CLI writes outside the build context, which Compose
          # grants from 5.6.1 on (docker/compose#14325) and the runners' Compose 2.38.2 does not
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
        run: go test -tags e2e -count=1 -v ./test/e2e/...

      # require the checkout as clean as the suites found it, since every test works in a home of its own
      - name: Check the checkout stays clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
