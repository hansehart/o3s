name: Spike prebuilt
on:
  workflow_dispatch:
  push:
    branches:
      - spike/prebuilt

permissions:
  contents: read

jobs:
  prebuilt:
    # time the cage VM from start to first cluster, on the stock image and on prepared ones
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # check out the scripts and the VM template
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install QEMU, the allow-list proxy and the seed tool, and hand the runner user KVM and vsock
      - name: Set up QEMU, KVM and vsock
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils tinyproxy cloud-image-utils
          sudo systemctl stop tinyproxy
          sudo modprobe kvm
          sudo modprobe vhost_vsock
          sudo chown "${USER}" /dev/kvm /dev/vhost-vsock

      # run the spike and keep its log for the summary
      - name: Run the prebuilt spike
        shell: bash
        run: SKIP_STOCK=1 bash spike/prebuilt.sh 2>&1 | tee spike.log

      # write each measurement into the run's summary
      - name: Summarize
        if: always()
        run: |
          {
            echo "### prebuilt"
            echo "| measurement | value | unit |"
            echo "|---|---|---|"
            grep -E '^(BENCH|RESULT)' spike.log | sed -E 's/^(BENCH|RESULT) //' || true
          } >> "${GITHUB_STEP_SUMMARY}"
